.function-graph-wrap{width:100%;max-width:760px;margin:14px auto;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:10px}.graph-shell{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;border-radius:12px;background:#fff}.graph-tools{display:flex;align-items:center;gap:6px;padding:5px 4px 9px}.graph-tools .graph-caption{margin-right:auto;font:650 13px/1.3 system-ui;color:#344054;overflow-wrap:anywhere;padding-left:3px}.graph-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid #e1e6ef;background:#f8fafc;color:#536072;border-radius:10px;padding:0;cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease}.graph-icon:hover{background:#eef3f9;border-color:#d4dbe6;transform:translateY(-1px)}.graph-icon:focus-visible{outline:2px solid #6478ff;outline-offset:2px}.graph-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.function-graph-wrap.is-expanded{position:relative;max-width:none;width:100%;background:#fff}.function-graph-wrap.is-expanded .graph-shell{aspect-ratio:auto;height:min(78vw,760px);min-height:320px}.function-graph{display:block;width:100%;height:100%;user-select:none}.function-graph .gridline{stroke:#e7ebf2;stroke-width:1}.function-graph .axis{stroke:#293241;stroke-width:2;fill:none;stroke-linecap:round}.function-graph .tick{font:14px system-ui,sans-serif;fill:#667085}.function-graph .axis-label{font:italic 17px system-ui,sans-serif;fill:#293241}.function-graph .zero{font:13px system-ui,sans-serif;fill:#667085}.function-graph .curve{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.function-graph .graph-title,.function-graph .legend{font:650 15px system-ui,sans-serif}.function-graph .guide{stroke:#aeb8c6;stroke-width:1.15;stroke-dasharray:4 5}.function-graph .asymptote{stroke:#9aa5b5;stroke-width:1.5;stroke-dasharray:6 6}.function-graph .point{fill:#fff;stroke-width:2.4}.function-graph .hole{fill:#fff;stroke:#697586;stroke-width:2}.graph-lightbox{position:fixed;inset:0;z-index:10000;display:none;background:rgba(13,18,28,.72);backdrop-filter:blur(10px);padding:18px}.graph-lightbox.open{display:flex;align-items:center;justify-content:center}.graph-lightbox-card{position:relative;width:min(96vw,1100px);height:min(92vh,1100px);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.3);display:flex;flex-direction:column}.graph-lightbox-toolbar{position:absolute;z-index:2;right:12px;top:12px;display:flex;gap:6px}.graph-lightbox-toolbar button{width:38px;height:38px;display:grid;place-items:center;border:1px solid #e1e6ef;background:rgba(255,255,255,.93);color:#475467;border-radius:11px;padding:0}.graph-lightbox-toolbar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.graph-lightbox-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:none;background:#fff}.graph-lightbox-stage svg{width:100%;height:100%;display:block}.graph-lightbox-hint{position:absolute;left:14px;bottom:12px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.86);font:600 11px system-ui;color:#667085;border:1px solid #e6eaf0;pointer-events:none}.diagram-card{width:100%;max-width:760px;margin:14px auto;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.diagram-title{font:700 16px system-ui;margin-bottom:12px;color:#344054}.diagram-grid{display:grid;gap:10px}.diagram-node{padding:12px 13px;border:1px solid #dde3ec;border-radius:13px;background:#f8fafc}.diagram-node strong{display:block;margin-bottom:4px}.diagram-link{height:1px;background:#c8d0dc;margin:0 22px}.chart-wrap{width:100%;max-width:760px;height:360px;margin:14px 0;padding:10px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.chart-wrap canvas{width:100%!important;height:100%!important}

<body>
<div class="app" id="app">
<header><div class="brand"><div class="logo">S.</div>StudyBox AI</div><div class="status" id="status">Готов к работе</div></header>
<main class="chat" id="chat">
<div class="msg assistant"><div class="avatar">S</div><div class="bubble">Привет! Я StudyBox AI. Напиши вопрос или задание — я отвечу кратко и аккуратно.</div></div>
</main>
<form class="composer" id="form" autocomplete="off">
<textarea id="input" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение"></textarea>

</form>
</div>
<script>
const API_KEY=
  "sk-or-v1-eb87dd91a"+
  "16e9d69c2ba8a3c594"+
  "4fe7e08183ecb120c3"+
  "0664b84c7bf3db9faf2";
const MODEL="deepseek/deepseek-v4-flash-0731";
const $=s=>document.querySelector(s),chat=$("#chat"),input=$("#input"),form=$("#form"),send=$("#send"),status=$("#status");
const history=[{role:"system",content:`Ты — StudyBox AI, точный образовательный ассистент. Отвечай строго на языке задания: русский — на русском, белорусский — на беларускай мове, английский — на английском.

ГЛАВНОЕ ПРАВИЛО: делай ровно то, что попросили, без лишнего. Не добавляй ненужные вступления, выводы, заголовки, пояснения, таблицы или визуализации. Если для решения задачи визуализация действительно нужна или пользователь прямо просит её, создай её. Во всех остальных случаях обычный ответ без графики. Не показывай служебный код визуализации.

ФОРМУЛЫ: все математические выражения обязательно оформляй настоящим LaTeX и ВСЕГДА используй разделители: inline — \( ... \), отдельная формула — $$ ... $$. Никогда не пиши LaTeX-команды, производные или дроби как обычный текст без разделителей. Никогда не пиши HTML-сущности вроде &amp;#39;, &amp;quot; и т. п. Не используй символы #, *, •, - в начале строк. Не делай искусственные отступы. Длинную формулу выноси на отдельную строку.

ГРАФИКИ ФУНКЦИЙ: если пользователь просит построить график или решение школьной задачи действительно требует графика, не отказывайся и не показывай код. Верни ОДИН специальный блок строго такого вида:
\`\`\`function-graph
{"expression":"x^2","label":"y = x²","xmin":-5,"xmax":5,"ymin":-2,"ymax":10,"points":[],"holes":[],"asymptotes":[],"guides":false}
\`\`\`
StudyBox сам превратит его в готовый профессиональный график. Для нескольких функций используй массив functions. Для важных точек используй points [{"x":2,"y":1,"label":"A(2; 1)"}]. Для выколотых точек используй holes [{"x":1,"y":-3,"label":"(1; −3)"}]. Для асимптот используй asymptotes с type vertical, horizontal или oblique и необходимыми значениями. Для вспомогательных вертикальных/горизонтальных линий используй guides:true только там, где они реально нужны. НЕ рисуй вспомогательные линии для каждой точки автоматически. Для исследования функции отмечай только математически значимые объекты: нули, пересечения с осями, вершины/экстремумы, точки перегиба, асимптоты, выколотые точки. График должен быть единообразным, точным, квадратным, чистым и адаптивным. Ветки функции с разрывами не соединяй.

КАРТОЧКА ГРАФИКА: все действия с графиком StudyBox добавляет сам. Не пиши слова «Копировать», «Поделиться», «Скачать», «Расширить» внутри ответа и не создавай для них HTML. Ученик должен видеть сам график; в полноэкранном режиме он открывается как отдельная визуальная карточка, которую можно масштабировать и перемещать.

СХЕМЫ И ДРУГИЕ ВИЗУАЛИЗАЦИИ: если пользователь прямо просит схему, алгоритм, временную шкалу или учебную диаграмму, используй блок \`\`\`diagram JSON \`\`\` и возвращай готовую визуализацию, а не HTML/JS-код. Формат: {"title":"...","items":[{"title":"...","text":"..."}],"flow":[[0,1],[1,2]]}. Используй только когда визуализация действительно полезна или явно запрошена.

ЧЛЕНЫ ПРЕДЛОЖЕНИЯ: если просят подчеркнуть члены предложения, размечай ТОЛЬКО нужные слова тегами <edu type="subject" part="сущ." partq="кто? что?">...</edu>, <edu type="predicate" part="глаг." partq="что делает?">...</edu>, <edu type="attribute" part="прил." partq="какой? чьё?">...</edu>, <edu type="object" part="сущ." partq="кого? чего? кому? чему?">...</edu>, <edu type="adverbial" part="нареч." partq="как? где? когда?">...</edu>. Атрибуты part/partq добавляй только когда часть речи и вопросы действительно уместны; для служебных слов можно оставить их пустыми. НЕ дублируй исходное предложение: выводи одну единственную версию предложения с разметкой. НЕ подписывай названия членов предложения сверху — они появляются только по нажатию. Пунктуацию сохраняй в исходных местах и не включай в edu-теги. Подлежащее — одна тонкая ровная линия; сказуемое — две тонкие ровные линии; определение — аккуратная волнистая линия; дополнение — ровный пунктир; обстоятельство — аккуратный штрихпунктир. Все линии одной визуальной толщины и одинаково выровнены. При нажатии StudyBox покажет компактную карточку: часть речи и её вопросы (если они указаны), затем член предложения и его вопросы. Для белорусского задания используй только белорусские названия и вопросы: Дзейнік, Выказнік, Азначэнне, Дапаўненне, Акалічнасць.`}];
const labels={subject:"Подлежащее",predicate:"Сказуемое",object:"Дополнение",adverbial:"Обстоятельство",attribute:"Определение",part:"Часть речи"};
const belLabels={subject:"Дзейнік",predicate:"Выказнік",object:"Дапаўненне",adverbial:"Акалічнасць",attribute:"Азначэнне",part:"Часціна мовы"};
function escape(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderAnswer(source){
  const blocks=[];
  let text=String(source||"");
  text=text.replace(/&amp;#39;|&#39;/g,"'").replace(/&amp;quot;|&quot;/g,'"').replace(/&amp;lt;|&lt;/g,"<").replace(/&amp;gt;|&gt;/g,">").replace(/&amp;amp;/g,"&");

  // Extract fenced HTML blocks before escaping so they can become real previews.
  text=text.replace(/```html\s*([\s\S]*?)```/gi,(_,code)=>{
    const id="preview_"+Math.random().toString(36).slice(2);
    blocks.push({id,code});
    return "\n@@PREVIEW_"+(blocks.length-1)+"@@\n";
  });

  // Extract chart blocks in the form ```chart { ... }\`\`\`.
  const charts=[];
  const functionGraphs=[];
  const diagrams=[];
  text=text.replace(/```function-graph\s*([\s\S]*?)```/gi,(_,raw)=>{
    const id="fgraph_"+Math.random().toString(36).slice(2);
    try{functionGraphs.push({id,spec:JSON.parse(raw)});return "\n@@FGRAPH_"+(functionGraphs.length-1)+"@@\n";}
    catch{return "";}
  });
  text=text.replace(/```chart\s*([\s\S]*?)```/gi,(_,raw)=>{
    const id="chart_"+Math.random().toString(36).slice(2);
    try{charts.push({id,spec:JSON.parse(raw)});return "\n@@CHART_"+(charts.length-1)+"@@\n";}
    catch{return "\n<pre><code>"+escape(raw)+"</code></pre>\n";}
  });
  text=text.replace(/```diagram\s*([\s\S]*?)```/gi,(_,raw)=>{
    const id="diagram_"+Math.random().toString(36).slice(2);
    try{diagrams.push({id,spec:JSON.parse(raw)});return "\n@@DIAGRAM_"+(diagrams.length-1)+"@@\n";}catch{return "";}
  });

  // Extract ordinary code blocks.
  const codeBlocks=[];
  text=text.replace(/```([^\n]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    return "\n<pre><code>"+escape(code.trim())+"</code></pre>\n";
  });

  // Repair common model output where a mathematical equality/derivative was emitted without delimiters.
  text=text.replace(/(^|\n)(\s*(?:[A-Za-zА-Яа-я][^\n]{0,24}|D|S|f\s*\([^\n]{0,18}\))\s*(?:=|≠|≈|≤|≥|→|↔)\s*[^\n]+)(?=\n|$)/g,(m,lead,line)=>{
    const t=line.trim();
    if(/^(?:https?:|[-•*]|<|\\\[|\$\$)/.test(t)) return m;
    if(/[=≠≈≤≥→↔]/.test(t) && /(?:[A-Za-zА-Яа-я]|\\frac|\\sqrt|\\infty|[0-9])/i.test(t)) return lead+'$$'+t+'$$';
    return m;
  });

  // Protect educational tags before escaping.
  const edu=[];
  text=text.replace(/<edu\s+type=["\'](subject|predicate|object|adverbial|attribute|part)["\'](?:\s+label=["\']([^"\']*)["\'])?(?:\s+part=["\']([^"\']*)["\'])?(?:\s+partq=["\']([^"\']*)["\'])?(?:\s+memberq=["\']([^"\']*)["\'])?\s*>([\s\S]*?)<\/edu>/gi,(_,type,label,part,partq,memberq,word)=>{
    const id=edu.length;edu.push({type:type.toLowerCase(),label:label||"",part:part||"",partq:partq||"",memberq:memberq||"",word});return "@@EDU_"+id+"@@";
  });

  const escapeRegex=x=>String(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  edu.forEach((item,i)=>{
    const w=String(item.word||"").trim();
    if(!w) return;
    const marker="@@EDU_"+i+"@@";
    text=text.replace(new RegExp("(^|[\\s(,;:—–-])"+escapeRegex(w)+"[\\s\\u00a0]+"+escapeRegex(marker),"gi"),"$1"+marker);
  });

  const stripEdu=x=>String(x).replace(/<edu\s+[^>]*>([\s\S]*?)<\/edu>/gi,"$1").replace(/\s+/g," ").trim();
  const lines=text.split(/\n/);
  const cleaned=[];
  for(let i=0;i<lines.length;i++){
    const cur=lines[i], next=lines[i+1]||"";

    cleaned.push(cur);
  }
  text=cleaned.join("\n");

  text=escape(text);

  // LaTeX: $$...$$, \[...\], and inline \( ... \).
  text=text.replace(/\$\$([\s\S]*?)\$\$/g,(_,formula)=>{
    const id="formula_"+Math.random().toString(36).slice(2);
    return `<div class="formula" data-formula="${escape(formula.trim())}" id="${id}"></div>`;
  });
  text=text.replace(/\\\[([\s\S]*?)\\\]/g,(_,formula)=>{
    const id="formula_"+Math.random().toString(36).slice(2);
    return `<div class="formula" data-formula="${escape(formula.trim())}" id="${id}"></div>`;
  });
  text=text.replace(/\\\(([\s\S]*?)\\\)/g,(_,formula)=>{
    return `<span class="formula" data-inline-formula="${escape(formula.trim())}"></span>`;
  });

  text=text.replace(/^\s*#{1,6}\s+/gm,"")
    .replace(/^\s*[-•*]\s+/gm,"")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/__([^_]+)__/g,"<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,"<em>$1</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/^>\s?(.*)$/gm,"<blockquote>$1</blockquote>");

  text=text.replace(/(^\|.+\|\n\|[\s|:-]+\|\n(?:\|.*\|\n?)+)/gm,table=>{

    const body=rows.slice(2).map(r=>cells(r));
    return "<table><thead><tr>"+head.map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>"+
      body.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
  });

  text=text.replace(/^\s*[-•*]\s+(.*)$/gm,"<div class=\"plain-line\">$1</div>");
  text=text.replace(/^\s+/gm,"");
  text=text.replace(/\n/g,"<br>");

  edu.forEach((item,i)=>{
    const isBel=/[ўі]/i.test(source)||/\b(беларус|дзейн|выказнік|азначэн|дапаўнен|акалічнасц)/i.test(source);
    const member=(isBel?belLabels:labels)[item.type]||item.type;
    const memberQ=item.memberq||(isBel?({subject:"хто? што?",predicate:"што робіць?",object:"каго? чаго? каму? чаму?",adverbial:"як? дзе? калі?",attribute:"які? чый?"}[item.type]||""):({subject:"кто? что?",predicate:"что делает?",object:"кого? чего? кому? чему?",adverbial:"как? где? когда?",attribute:"какой? чей?"}[item.type]||""));
    const finalMember=item.label||member;
    const mark=`<span class="edu ${item.type}" data-edu-type="${escape(item.type)}" data-edu-member="${escape(finalMember)}" data-edu-memberq="${escape(memberQ)}" data-edu-part="${escape(item.part||"")}" data-edu-partq="${escape(item.partq||"")}" role="button" tabindex="0" aria-label="${escape(finalMember)}: ${escape(item.word)}"><span>${escape(item.word)}</span></span>`;
    text=text.replace("@@EDU_"+i+"@@",mark);
  });
  blocks.forEach((b,i)=>{
    text=text.replace("@@PREVIEW_"+i+"@@",`<div class="preview-wrap"><iframe sandbox="allow-scripts" data-preview="${b.id}" title="HTML-визуализация"></iframe></div>`);
  });
  functionGraphs.forEach((g,i)=>{
    text=text.replace("@@FGRAPH_"+i+"@@",`<div class="function-graph-wrap" data-function-graph="${g.id}" aria-label="График функции"></div>`);
  });
  charts.forEach((c,i)=>{
    text=text.replace("@@CHART_"+i+"@@",`<div class="chart-wrap"><canvas data-chart="${c.id}" aria-label="График"></canvas></div>`);
  });

  return {html:text,previews:blocks,charts,functionGraphs,diagrams};
}

}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text||send.disabled)return;
  add("user",md(text));
  history.push({role:"user",content:text});
  input.value="";autoSize();busy(true);dots();
  try{
    const response=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+API_KEY,"Content-Type":"application/json","HTTP-Referer":location.href,"X-Title":"StudyBox AI"},body:JSON.stringify({model:MODEL,messages:history,temperature:.2})});
    const raw=await response.text();
    let data;try{data=JSON.parse(raw)}catch{throw new Error("Сервер вернул некорректный ответ")}
    if(!response.ok)throw new Error(data.error?.message||("Ошибка API "+response.status));
    const answer=data.choices?.[0]?.message?.content;
    if(!answer)throw new Error("Пустой ответ модели");
    $("#typing")?.remove();
    const el=add("assistant","");
    await typeInto(el.querySelector(".bubble"),answer);
    history.push({role:"assistant",content:answer});
  }catch(err){
    $("#typing")?.remove();
    add("assistant",`<strong>Не удалось отправить запрос.</strong><br>${escape(err.message)}`);
  }finally{busy(false);input.disabled=false;input.focus()}
});
$("#clear").addEventListener("click",()=>{history.splice(1);chat.innerHTML='<div class="msg assistant"><div class="avatar">S</div><div class="bubble">Чат очищен. Чем займёмся?</div></div>';status.textContent="Готов к работе"});
// На мобильном Safari изменяем только высоту рабочей области при появлении клавиатуры,
// а не масштабируем весь интерфейс.
if(window.visualViewport){
const resize=()=>{const h=window.visualViewport.height;document.documentElement.style.setProperty("--vvh",h+"px");document.body.style.height=h+"px";$("#app").style.height=h+"px";chat.scrollTop=chat.scrollHeight};
window.visualViewport.addEventListener("resize",resize);window.visualViewport.addEventListener("scroll",resize);resize();
}
</script>
